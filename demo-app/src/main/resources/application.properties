xy.hello.prefix=Hello from custom starter
spring.application.name=jvm-oom-lab
server.port=${SERVER_PORT:8090}

# Local lab database. Override these three values when using an existing MySQL.
spring.datasource.url=${EXPORT_LAB_DB_URL:jdbc:mysql://127.0.0.1:13307/export_lab?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true}
spring.datasource.username=${EXPORT_LAB_DB_USERNAME:export_lab}
spring.datasource.password=${EXPORT_LAB_DB_PASSWORD:export_lab_2026}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/export-lab-schema.sql
spring.sql.init.continue-on-error=false

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-fetch-size=1000

export-lab.output-dir=${EXPORT_LAB_OUTPUT_DIR:./runtime/export-output}
export-lab.evidence-dir=${EXPORT_LAB_EVIDENCE_DIR:./runtime/evidence}
export-lab.max-retained-tasks=30

logging.file.name=${EXPORT_LAB_APP_LOG:./runtime/logs/application.log}
logging.level.com.xy.interview.demo.exportlab=INFO
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{48} - %msg%n
